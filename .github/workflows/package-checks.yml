name: AmbisGIS package checks
on:
  pull_request:
    branches: [ambisgis/main]
  push:
    branches: [ambisgis/main]
permissions: {}
concurrency:
  group: package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package-and-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact public owned source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          test "$SOURCE_REPOSITORY" = aloerch/ambisgis-platform
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git init source
          git -C source remote add origin https://github.com/aloerch/ambisgis-platform.git
          git -C source fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install hash-locked validation tools
        working-directory: source
        run: |
          set -eu
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r plan/requirements-ci.lock
      - name: Package tests and strict schemas
        working-directory: source/plan
        run: |
          set -eu
          ../.ci-venv/bin/python -m unittest discover -s tests -v
          ../.ci-venv/bin/python tools/validate_package.py --require-schemas
